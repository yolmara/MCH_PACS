services:
  db:
    image: postgres:17
    container_name: pacs-docker-db
    restart: always
    environment:
      POSTGRES_USER: coder911
      POSTGRES_PASSWORD: coder.03
      POSTGRES_DB: pacsdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pacs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder911 -d pacsdb"]
      interval: 2s
      timeout: 5s
      retries: 10

  flask-app:
    build:
      context: .
      dockerfile: dockerfile
    command: python app.py
    container_name: flask-app
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql+psycopg2://coder911:coder.03@db:5432/pacsdb
      - ORTHANC_NOTIFY_TOKEN=99fd1ce50f974220de9f13ee05887b9a576e9a586bbcbbd9
    volumes:
      - ./migrations:/app/migrations
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./models:/app/models
      - ./dicom_utils:/app/dicom_utils
      - ./static/uploads:/app/static/uploads
      - ./templates:/app/templates
      - ./static:/app/static
      - ./Blueprints:/app/Blueprints
      - dicom-incoming:/app/incoming
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pacs-net

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: pacs-orthanc
    restart: always
    ports:
      - "4242:4242"   # DICOM C-STORE (Siemens pushes here)
      - "8042:8042"   # Orthanc REST API
    environment:
      ORTHANC_NOTIFY_URL: "http://flask-app:5000/dicom/notify"
      ORTHANC_NOTIFY_TOKEN: "99fd1ce50f974220de9f13ee05887b9a576e9a586bbcbbd9"
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./docker/orthanc/notify.lua:/etc/orthanc/notify.lua:ro
    depends_on:
      - flask-app
    networks:
      - pacs-net

  ohif-viewer:
    image: ohif/app:latest
    container_name: ohif-viewer
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/app-config.js
    networks:
      - pacs-net

  nginx:
    image: nginx:stable-alpine
    container_name: pacs-nginx
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app
      - ohif-viewer
      - orthanc
    networks:
      - pacs-net

volumes:
  pgdata:
  orthanc-storage:
  dicom-incoming:

networks:
  pacs-net:
