services:
  db:
    image: postgres:17
    container_name: pacs-docker-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pacs}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me-db-password}
      POSTGRES_DB: ${POSTGRES_DB:-pacsdb}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pacs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pacs} -d ${POSTGRES_DB:-pacsdb}"]
      interval: 2s
      timeout: 5s
      retries: 10

  flask-app:
    build:
      context: .
      dockerfile: dockerfile
    command: >-
      gunicorn --workers ${GUNICORN_WORKERS:-4}
      --bind 0.0.0.0:5000
      --timeout ${GUNICORN_TIMEOUT:-180}
      app:app
    container_name: flask-app
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-change-me-flask-secret}
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-pacs}:${POSTGRES_PASSWORD:-change-me-db-password}@db:5432/${POSTGRES_DB:-pacsdb}
      - ORTHANC_NOTIFY_TOKEN=${ORTHANC_NOTIFY_TOKEN:-change-me-orthanc-notify-token}
      - OHIF_VIEWER_URL=${OHIF_VIEWER_URL:-http://localhost:8080}
      - BOOTSTRAP_ADMIN_USERNAME=${BOOTSTRAP_ADMIN_USERNAME}
      - BOOTSTRAP_ADMIN_PASSWORD=${BOOTSTRAP_ADMIN_PASSWORD}
      - BOOTSTRAP_ADMIN_RESET=${BOOTSTRAP_ADMIN_RESET:-0}
    volumes:
      - ./migrations:/app/migrations
      - ./app.py:/app/app.py
      - ./config.py:/app/config.py
      - ./models:/app/models
      - ./dicom_utils:/app/dicom_utils
      - ./static/uploads:/app/static/uploads
      - ./templates:/app/templates
      - ./static:/app/static
      - ./Blueprints:/app/Blueprints
      - dicom-incoming:/app/incoming
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pacs-net

  orthanc:
    image: orthancteam/orthanc:latest
    container_name: pacs-orthanc
    restart: always
    ports:
      - "4242:4242"   # DICOM C-STORE (Siemens pushes here)
      - "127.0.0.1:8042:8042"   # Orthanc REST API (host-local)
    environment:
      ORTHANC_NOTIFY_URL: "${ORTHANC_NOTIFY_URL:-http://flask-app:5000/dicom/notify}"
      ORTHANC_NOTIFY_TOKEN: "${ORTHANC_NOTIFY_TOKEN:-change-me-orthanc-notify-token}"
      ORTHANC__AUTHENTICATIONENABLED: "true"
      ORTHANC__REGISTEREDUSERS: '{"admin":"${ORTHANC_ADMIN_PASSWORD:-change-me-orthanc-admin-password}"}'
      ORTHANC__DICOMAET: "${ORTHANC_AET:-MCH_PACS}"
    volumes:
      - orthanc-storage:/var/lib/orthanc/db
      - ./docker/orthanc/orthanc.json:/etc/orthanc/orthanc.json:ro
      - ./docker/orthanc/notify.lua:/etc/orthanc/notify.lua:ro
    depends_on:
      - flask-app
    networks:
      - pacs-net

  ohif-viewer:
    image: ohif/app:latest
    container_name: ohif-viewer
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/app-config.js
    networks:
      - pacs-net

  nginx:
    image: nginx:stable-alpine
    container_name: pacs-nginx
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app
      - ohif-viewer
      - orthanc
    networks:
      - pacs-net

volumes:
  pgdata:
  orthanc-storage:
  dicom-incoming:

networks:
  pacs-net:
