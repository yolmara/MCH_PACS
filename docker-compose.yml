services:
  db:
    image: postgres:17
    container_name: pacs-docker-db
    restart: always
    environment:
      POSTGRES_USER: coder911
      POSTGRES_PASSWORD: coder.03
      POSTGRES_DB: pacsdb
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - pacs-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coder911 -d pacsdb"]
      interval: 2s
      timeout: 5s
      retries: 10

  flask-app:
    build:
      context: .
      dockerfile: dockerfile
    command: python app.py
    container_name: flask-app
    restart: always
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=development
      - DATABASE_URL=postgresql+psycopg2://coder911:coder.03@db:5432/pacsdb
    volumes:
      - ./migrations:/app/migrations
      - ./static/uploads:/app/static/uploads      # ← ADD THIS LINE
      - ./templates:/app/templates
      - ./static:/app/static
      - ./Blueprints:/app/Blueprints
    depends_on:
      db:
        condition: service_healthy
    networks:
      - pacs-net

  ohif-viewer:
    image: ohif/app:latest
    container_name: ohif-viewer
    restart: always
    ports:
      - "8080:80"
    volumes:
      - ./docker/ohif/app-config.js:/usr/share/nginx/html/app-config.js
    networks:
      - pacs-net

  nginx:
    image: nginx:stable-alpine
    container_name: pacs-nginx
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - flask-app
      - ohif-viewer
    networks:
      - pacs-net

volumes:
  pgdata:

networks:
  pacs-net:
