{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
{% endblock %}

{% block body %}
<div class="login-page">
  <div class="logintext">
    <h1>MCH PACS System</h1>
    <p>Register user! Already have an account? <a href="{{ url_for('login') }}">Login</a></p>
  </div>

  <div class="loginform">
    <form method="POST" action="{{ url_for('register') }}">

      <input name="username" type="text" placeholder="Username" required><br/><br/>

      <input id="password" name="password" type="password" placeholder="Password" required>

      <!-- Role selection -->
      <input type="radio" name="role" value="user" checked onchange="toggleTokenField()"> User
      <input type="radio" name="role" value="admin" onchange="toggleTokenField()"> Admin<br/><br/>

      <!-- Admin Token (shows only if Admin selected) -->
      <div id="admin-token-field" style="display: none;">
        <input name="admin_token" type="password" placeholder="Admin Token" autocomplete="off"><br/><br/>
      </div>

      <button type="submit">Register</button>
    </form>
  </div>
</div>

<!-- Java Scripts -->
<script>
function toggleTokenField() {
  const isAdmin = document.querySelector('input[value="admin"]:checked');
  document.getElementById('admin-token-field').style.display = isAdmin ? 'block' : 'none';
}

function togglePassword(fieldId, btnId) {
  const input = document.getElementById(fieldId);
  const btn = document.getElementById(btnId);
  if (input.type === 'password') {
    input.type = 'text';
    btn.textContent = '🔐';
  } else {
    input.type = 'password';
    btn.textContent = '🔑';
  }
}
</script>

{% endblock %}
