<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MCH PACS</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="login-page">
        <div class="login-bg-shape login-bg-shape-a" aria-hidden="true"></div>
        <div class="login-bg-shape login-bg-shape-b" aria-hidden="true"></div>

        <section class="login-card" aria-label="Login form">
            <div class="login-header">
                <img src="{{ url_for('static', filename='images/mpilo_logo_200px.png') }}" alt="Mpilo Logo">
                <h1>MCH PACS</h1>
                <p class="login-subtitle">Secure clinical imaging access</p>
            </div>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth_bp.login') }}" class="login-form">
                <div class="form-group">
                    <label for="username">Username</label>
                    <input type="text" id="username" name="username" required autofocus autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="password-wrap">
                        <input type="password" id="password" name="password" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="password-toggle" aria-label="Show password">
                            Show
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-login">Sign In</button>
            </form>
        </section>
    </main>
    <script>
        (function () {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePassword');
            if (!passwordInput || !toggleBtn) return;

            toggleBtn.addEventListener('click', function () {
                const isHidden = passwordInput.type === 'password';
                passwordInput.type = isHidden ? 'text' : 'password';
                toggleBtn.textContent = isHidden ? 'Hide' : 'Show';
                toggleBtn.setAttribute('aria-label', isHidden ? 'Hide password' : 'Show password');
            });
        })();
    </script>
</body>
</html>
