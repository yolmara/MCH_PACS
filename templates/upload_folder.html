{% extends 'base.html' %}

{% block title %}Upload Patient Folder - MCH PACS{% endblock %}

{% block body %}
<div class="container" style="max-width: 600px; margin: 80px auto; background: #ffffff; padding: 25px; border-radius: 14px; box-shadow: 0 8px 20px rgba(0,0,0,0.12);">
    <h2 style="color: #004080; font-weight: 600; margin-bottom: 10px;">Upload Patient Folder</h2>
    <p>Select a folder containing DICOM files for this patient.</p>

    <form id="uploadForm" action="{{ url_for('upload_bp.upload_folder') }}" method="POST" enctype="multipart/form-data">

        <div style="margin-bottom: 20px;">
            <label style="font-weight: 600; color: #004080; display: block; margin-bottom: 6px;">Patient ID *</label>
            <input type="text" name="patient_id" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;" />
        </div>

        <div style="margin-bottom: 20px;">
            <label style="font-weight: 600; color: #004080; display: block; margin-bottom: 6px;">Ward/Location *</label>
            <select id="ward_id" name="ward_id" required style="width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #ccc;">
                <option value="">Loading wards...</option>
            </select>
        </div>

        <div style="margin-bottom: 20px;">
            <label style="font-weight: 600; color: #004080; display: block; margin-bottom: 6px;">Upload Folder *</label>
            <div style="border: 2px dashed #004080; padding: 30px; text-align: center; border-radius: 12px; cursor: pointer;" onclick="document.getElementById('folderInput').click()">
                <span id="folderText">Click to select folder</span>
            </div>
            <input 
                id="folderInput"
                type="file" 
                name="files" 
                webkitdirectory 
                directory 
                multiple 
                required
                style="display:none;"
                onchange="updateFolderText()"
            >
        </div>

        <button type="submit" style="margin-top: 20px; width: 100%; background: #004080; color: white; padding: 12px; border: none; border-radius: 10px; font-size: 16px; cursor: pointer;">
            Upload Folder
        </button>
    </form>

    <div id="uploadStatus" style="margin-top: 20px; display: none;">
        <div style="padding: 15px; border-radius: 8px; background: #e3f2fd; color: #1976d2;">
            <strong>Uploading...</strong>
            <div id="progressText"></div>
        </div>
    </div>
</div>

<script>
// Load wards on page load
window.onload = async () => {
    try {
        const res = await fetch('/wards/');
        const wards = await res.json();
        
        const select = document.getElementById('ward_id');
        
        if (wards.length === 0) {
            select.innerHTML = '<option value="">No wards available</option>';
            alert('No wards found. Please ask an admin to create wards first.');
            return;
        }
        
        select.innerHTML = '<option value="">Select Ward</option>';
        
        // Group by department
        const byDept = {};
        wards.forEach(ward => {
            const dept = ward.department || 'Other';
            if (!byDept[dept]) byDept[dept] = [];
            byDept[dept].push(ward);
        });
        
        // Add options grouped by department
        Object.keys(byDept).sort().forEach(dept => {
            const optgroup = document.createElement('optgroup');
            optgroup.label = dept;
            
            byDept[dept].forEach(ward => {
                const option = document.createElement('option');
                option.value = ward.id;
                option.textContent = ward.name;
                optgroup.appendChild(option);
            });
            
            select.appendChild(optgroup);
        });
    } catch (error) {
        console.error('Error loading wards:', error);
        document.getElementById('ward_id').innerHTML = '<option value="">Error loading wards</option>';
        alert('Failed to load wards. Please refresh the page or contact support.');
    }
};

function updateFolderText() {
    const input = document.getElementById('folderInput');
    const text = document.getElementById('folderText');
    if (input.files.length > 0) {
        text.textContent = `${input.files.length} files selected`;
    }
}

// Handle form submission
document.getElementById('uploadForm').addEventListener('submit', async (e) => {
    e.preventDefault();

    const form = e.target;
    const patientId = form.patient_id.value.trim();
    const wardId = form.ward_id.value;
    const files = Array.from(document.getElementById('folderInput').files || []);

    if (!patientId) {
        alert('Patient ID is required.');
        return;
    }
    if (!wardId) {
        alert('Ward is required.');
        return;
    }
    if (!files.length) {
        alert('Please select a folder.');
        return;
    }

    // Keep each request body moderate to avoid parser/temp-file FD exhaustion.
    const MAX_BATCH_BYTES = 180 * 1024 * 1024; // 180 MB
    const MAX_BATCH_FILES = 160;

    const batches = [];
    let currentBatch = [];
    let currentBytes = 0;

    for (const file of files) {
        const nextBytes = currentBytes + file.size;
        if (
            currentBatch.length > 0 &&
            (nextBytes > MAX_BATCH_BYTES || currentBatch.length >= MAX_BATCH_FILES)
        ) {
            batches.push(currentBatch);
            currentBatch = [];
            currentBytes = 0;
        }
        currentBatch.push(file);
        currentBytes += file.size;
    }
    if (currentBatch.length > 0) {
        batches.push(currentBatch);
    }

    const statusDiv = document.getElementById('uploadStatus');
    const progressText = document.getElementById('progressText');
    
    statusDiv.style.display = 'block';
    progressText.textContent = `Preparing ${files.length} files in ${batches.length} batch(es)...`;
    
    try {
        const aggregate = { created: [], errors: [] };

        for (let i = 0; i < batches.length; i++) {
            const batch = batches[i];
            progressText.textContent = `Uploading batch ${i + 1}/${batches.length} (${batch.length} files)...`;

            const formData = new FormData();
            formData.append('patient_id', patientId);
            formData.append('ward_id', wardId);
            for (const file of batch) {
                formData.append('files', file, file.webkitRelativePath || file.name);
            }

            const response = await fetch(form.action, {
                method: 'POST',
                body: formData
            });

            let result = {};
            try {
                result = await response.json();
            } catch (jsonErr) {
                if (!response.ok) {
                    throw new Error(`Batch ${i + 1} failed with status ${response.status}`);
                }
            }

            if (!response.ok) {
                throw new Error(result.error || result.message || `Batch ${i + 1} upload failed`);
            }

            if (Array.isArray(result.created)) {
                aggregate.created.push(...result.created);
            }
            if (Array.isArray(result.errors)) {
                aggregate.errors.push(...result.errors);
            }
        }

        statusDiv.style.background = '#e8f5e9';
        statusDiv.style.color = '#2e7d32';

        const firstCreated = aggregate.created[0];
        const viewerLaunchUrl = "{{ url_for('dicom_bp.ohif_viewer') }}";
        const studyLink = firstCreated
            ? `<a href="${viewerLaunchUrl}?StudyInstanceUIDs=${encodeURIComponent(firstCreated.study_uid)}"
                  target="_blank"
                  style="display: inline-block; margin-top: 10px; padding: 10px 20px; background: #1976d2; color: white; text-decoration: none; border-radius: 6px; font-weight: bold;">
                  Open Images in OHIF Viewer
               </a>`
            : '';

        progressText.innerHTML = `
            <strong>Upload Complete</strong><br>
            Created: ${aggregate.created.length} files<br>
            Errors: ${aggregate.errors.length} files<br>
            Patient ID: ${patientId}<br><br>
            ${studyLink}
        `;

        if (aggregate.errors.length > 0) {
            const reasonMap = new Map();
            for (const err of aggregate.errors) {
                const reason = (err && err.error) ? String(err.error) : 'Unknown error';
                reasonMap.set(reason, (reasonMap.get(reason) || 0) + 1);
            }
            const topReasons = Array.from(reasonMap.entries())
                .sort((a, b) => b[1] - a[1])
                .slice(0, 3);

            const reasonHtml = topReasons.map(([reason, count]) =>
                `- ${count} file(s): ${reason}`
            ).join('<br>');

            const sampleFiles = aggregate.errors
                .slice(0, 5)
                .map((err) => err.file || '(no filename)')
                .join(', ');

            progressText.innerHTML += `
                <strong>Error Summary</strong><br>
                ${reasonHtml || '- No reason available'}<br><br>
                <strong>Sample Files:</strong> ${sampleFiles}
            `;
        }

        setTimeout(() => {
            form.reset();
            statusDiv.style.display = 'none';
            document.getElementById('folderText').textContent = 'Click to select folder';
        }, 15000);
    } catch (error) {
        statusDiv.style.background = '#ffebee';
        statusDiv.style.color = '#c62828';
        progressText.innerHTML = `<strong>Error:</strong> ${error.message}`;
    }
});
</script>
{% endblock %}
