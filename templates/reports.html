{% extends 'base.html' %}
{% block title %}📊 System Reports{% endblock %}

{% block body %}
<h2 class="report-title">📊 System Summary Reports</h2>

<div class="report-container">
  <form method="GET" action="{{ url_for('reports') }}" class="report-form">
    <label for="start_date">Start Date:</label>
    <input type="date" name="start_date" value="{{start_date}}" required>

    <label for="end_date">End Date:</label>
    <input type="date" name="end_date" value="{{end_date}}" required>

    <button type="submit" class="generate-btn">Generate Report</button>
  </form>

  <div class="stats-summary">
    <div class="stat-card">
      <h3>📅 Today</h3>
      <p>{{ daily_count }} Scans</p>
    </div>
    <div class="stat-card">
      <h3>🗓️ This Week</h3>
      <p>{{ weekly_count }} Scans</p>
    </div>
    <div class="stat-card">
      <h3>📆 This Month</h3>
      <p>{{ monthly_count }} Scans</p>
    </div>
  </div>

  <div class="chart-container">
    <canvas id="scanChart"></canvas>
  </div>

  <form method="POST" action="{{ url_for('reports') }}">
    <input type="hidden" name="start_date" value="{{start_date.strftime('%Y-%m-%d')}}">
    <input type="hidden" name="end_date" value="{{end_date.strftime('%Y-%m-%d')}}">
    <button type="submit" name="download_pdf" class="download-btn">⬇️ Download PDF</button>
  </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
const ctx = document.getElementById('scanChart');
new Chart(ctx, {
  type: 'bar',
  data: {
    labels: ['MRI', 'CT', 'X-Ray', 'PDF', 'PNG'],
    datasets: [{
      label: 'Total Scans',
      data: [{{ mr_count }}, {{ ct_count }}, {{ xray_count }}, {{ pdf_count }}, {{ png_count }}],
      borderWidth: 1,
      backgroundColor: [
        '#004080', '#007bff', '#61b0ff', '#c4d5fa', '#f8b8b9'
      ],
    }]
  },
  options: {
    responsive: true,
    scales: { y: { beginAtZero: true } }
  }
});
</script>
{% endblock %}
