{% extends 'base.html' %}

{% block title %}New Exam Order - MCH PACS{% endblock %}

{% block body %}
<main class="worklist-container">
    {% include 'ris/_subnav.html' %}

    <div class="page-header">
        <h2>New Radiology Exam Order</h2>
    </div>

    <div class="table-card" style="max-width: 900px; margin: 0 auto;">
        <h3>Order Exam For: {{ patient.patient_name or patient.patient_id }}</h3>

        <form method="POST" class="schedule-create-form">
            <div>
                <label>Patient ID</label>
                <input type="text" value="{{ patient.patient_id }}" readonly>
            </div>
            <div>
                <label>Patient Name</label>
                <input type="text" value="{{ patient.patient_name or 'N/A' }}" readonly>
            </div>
            <div>
                <label for="doctor_name">Ordering Doctor *</label>
                <input
                    type="text"
                    id="doctor_name"
                    name="doctor_name"
                    value="{{ session.get('full_name', '') }}"
                    required
                >
            </div>
            <div>
                <label for="exam_type">Exam Type *</label>
                <select id="exam_type" name="exam_type" required>
                    <option value="">Select Exam Type</option>
                    <option value="CT">CT Scan</option>
                    <option value="MRI">MRI</option>
                    <option value="X-Ray">X-Ray</option>
                    <option value="Ultrasound">Ultrasound</option>
                    <option value="Mammography">Mammography</option>
                    <option value="Fluoroscopy">Fluoroscopy</option>
                </select>
            </div>
            <div>
                <label for="body_part">Body Part *</label>
                <input
                    type="text"
                    id="body_part"
                    name="body_part"
                    placeholder="e.g., Head, Chest, Abdomen"
                    required
                >
            </div>
            <div>
                <label for="priority">Priority *</label>
                <select id="priority" name="priority" required>
                    <option value="routine" selected>Routine</option>
                    <option value="urgent">Urgent</option>
                    <option value="stat">STAT (Emergency)</option>
                </select>
            </div>
            <div class="field-full">
                <label for="clinical_indication">Clinical Indication / Reason *</label>
                <textarea
                    id="clinical_indication"
                    name="clinical_indication"
                    rows="4"
                    placeholder="Describe symptoms, suspected diagnosis, or reason for ordering exam..."
                    required
                ></textarea>
            </div>
            <div class="field-full schedule-actions">
                <button type="submit" class="btn btn-primary">Submit Order</button>
                <a href="{{ url_for('ris_bp.list_orders') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</main>
{% endblock %}
