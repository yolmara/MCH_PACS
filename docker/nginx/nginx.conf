events { }

http {
    # Allow large uploads through nginx (slightly above Flask limit)
    client_max_body_size 10g;
    client_body_timeout 1800s;
    send_timeout 1800s;

    server {
        listen 80;
        server_name localhost;

        location = /ohif {
            return 301 /ohif/;
        }

        location = /dicomweb {
            return 301 /dicomweb/;
        }

        location = /_auth {
            internal;
            proxy_pass http://flask-app:5000/auth/session-check;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        # Separate role-aware probe for diagnostic-image access.
        location = /_viewer_auth {
            internal;
            proxy_pass http://flask-app:5000/auth/viewer-session-check;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
        }

        location @login_redirect {
            return 302 $scheme://$http_host/auth/login?next=$request_uri;
        }

        # Prevent direct static-file URLs from bypassing the DICOMweb access rule.
        location ~ ^/static/uploads/(?!reports/) {
            auth_request /_viewer_auth;
            error_page 401 = @login_redirect;
            proxy_pass http://flask-app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # OHIF static assets — built with PUBLIC_URL=/ so requested at root
        location ~* ^/(app-config\.js(\.gz)?|(app|\d+)\.bundle[^/]*\.(js|css)(\.gz)?|\d+\.css(\.gz)?|init-service-worker\.js|manifest\.json|precache-manifest[^/]*\.js|service-worker\.js) {
            proxy_pass http://ohif-viewer:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location ^~ /assets/ {
            proxy_pass http://ohif-viewer:80;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Flask backend
        location / {
            proxy_pass http://flask-app:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
            proxy_request_buffering off;
        }

        # Protected OHIF viewer
        location ^~ /ohif/ {
            auth_request /_viewer_auth;
            error_page 401 = @login_redirect;
            proxy_pass http://ohif-viewer:80/;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }

        # DICOMweb — proxied directly to Orthanc (C++) bypassing Flask for performance
        location /dicomweb/ {
            auth_request /_viewer_auth;
            error_page 401 = @login_redirect;

            if ($request_method = 'OPTIONS') {
                add_header 'Access-Control-Allow-Origin' '*' always;
                add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
                add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept,Authorization' always;
                add_header 'Access-Control-Max-Age' 1728000 always;
                add_header 'Content-Type' 'text/plain; charset=utf-8' always;
                add_header 'Content-Length' 0 always;
                return 204;
            }

            add_header 'Access-Control-Allow-Origin' '*' always;
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
            add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Accept,Authorization' always;
            add_header 'Access-Control-Expose-Headers' 'Content-Length,Content-Range,Content-Type' always;

            # nginx injects Orthanc Basic auth on behalf of OHIF
            proxy_pass http://orthanc:8042/dicomweb/;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Port $server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Authorization "Basic YWRtaW46Y2hhbmdlLW1lLW9ydGhhbmMtYWRtaW4tcGFzc3dvcmQ=";
            proxy_connect_timeout 60s;
            proxy_send_timeout 1800s;
            proxy_read_timeout 1800s;
        }
    }
}